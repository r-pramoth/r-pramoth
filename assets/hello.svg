<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Pramothraj. Embedded systems and firmware.</title>
  <desc id="desc">A colourful introduction with rotating typewriter text, floating sun and bubbles, a moving colour accent and layered rolling waves.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0d8"/>
      <stop offset=".36" stop-color="#ffe4ed"><animate attributeName="stop-color" values="#ffe4ed;#f0ddff;#ffe4ed" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset=".72" stop-color="#e6dcff"/>
      <stop offset="1" stop-color="#c9f2ee"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7130b7"/><stop offset=".55" stop-color="#b73e82"/><stop offset="1" stop-color="#d2613f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc85c"/><stop offset="1" stop-color="#ff806a"/></linearGradient>
    <linearGradient id="ribbon"><stop stop-color="#f47e73"/><stop offset=".46" stop-color="#ad71e8"/><stop offset="1" stop-color="#27b7b2"/></linearGradient>
    <linearGradient id="wave"><stop stop-color="#fead87"/><stop offset=".5" stop-color="#c190ec"/><stop offset="1" stop-color="#55c9c1"/></linearGradient>
    <clipPath id="bounds"><rect width="1200" height="380" rx="22"/></clipPath>
    <clipPath id="line-0"><rect x="0" y="-30" width="481.2" height="46"><animate attributeName="width" values="0;481.2;481.2;0;0;0" keyTimes="0.00000;0.12500;0.24500;0.29500;0.33333;1.00000" dur="24s" repeatCount="indefinite" /></rect></clipPath>
    <clipPath id="line-1"><rect x="0" y="-30" width="0" height="46"><animate attributeName="width" values="0;0;654;654;0;0;0" keyTimes="0.00000;0.33333;0.45833;0.57833;0.62833;0.66667;1.00000" dur="24s" repeatCount="indefinite" /></rect></clipPath>
    <clipPath id="line-2"><rect x="0" y="-30" width="0" height="46"><animate attributeName="width" values="0;0;668.4;668.4;0;0" keyTimes="0.00000;0.66667;0.79167;0.91167;0.96167;1.00000" dur="24s" repeatCount="indefinite" /></rect></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .typed text { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 24px; }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .still { display: inline; }
    }
  </style>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="380" fill="url(#sky)"/>
    <ellipse cx="1090" cy="226" rx="180" ry="112" fill="#c294f0" opacity=".16"/>
    <g transform="translate(1046 128)">
      <g class="motion">
        <animateTransform attributeName="transform" type="translate" values="0 0;7 -14;0 0" dur="7s" repeatCount="indefinite"/>
        <circle r="54" fill="url(#sun)"/>
        <circle r="72" fill="none" stroke="#e79b7c" stroke-width="1.4" stroke-dasharray="106 25 38 35 62 186" opacity=".8">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
        </circle>
        <circle cx="48" cy="-54" r="6" fill="#9970de"/>
      </g>
      <circle class="still" r="54" fill="url(#sun)"/>
    </g>
    <g class="motion">
      <circle cx="1131" cy="229" r="22" fill="#32b9b0" opacity=".72">
        <animate attributeName="cy" values="229;208;229" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="1131;1144;1131" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="934" cy="232" r="12" fill="#e275a4" opacity=".8">
        <animate attributeName="cy" values="232;249;232" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="902" cy="98" r="5" fill="#9c70d9">
        <animate attributeName="r" values="5;8;5" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#6b4b92">
      <circle cx="78" cy="49" r="4.5" fill="#1fa89f"/>
      <circle class="motion" cx="78" cy="49" r="4.5" fill="none" stroke="#1fa89f">
        <animate attributeName="r" values="4.5;12;4.5" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;0;.7" dur="4s" repeatCount="indefinite"/>
      </circle>
      <text x="94" y="55" font-size="17" letter-spacing="1.5">EMBEDDED SYSTEMS · FIRMWARE</text>
    </g>
    <text x="72" y="136" fill="url(#ink)" style="font-family:Georgia,'Times New Roman',serif" font-size="64" letter-spacing="-1.5">Hi, I'm Pramothraj.</text>
    <path d="M76 151 Q320 159 620 149" fill="none" stroke="url(#ribbon)" stroke-width="4" stroke-linecap="round" opacity=".45"/>
    <path class="motion" d="M76 151 Q320 159 620 149" fill="none" stroke="url(#ribbon)" stroke-width="4" stroke-linecap="round" stroke-dasharray="120 440">
      <animate attributeName="stroke-dashoffset" values="120;-560" dur="6s" repeatCount="indefinite"/>
    </path>
    <text x="76" y="192" font-size="23" fill="#5b526b">I like figuring out how software works with hardware.</text>
  <g class="typed" transform="translate(77 244)" fill="#6d35c4" style="font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-size:24px">
    <g class="motion">
      <g clip-path="url(#line-0)"><text y="0">C / Embedded C / microcontrollers</text></g>
      <rect y="-24" width="2" height="29" fill="#6d35c4" opacity="0">
        <animate attributeName="x" values="0;481.2;481.2;0;0;0" keyTimes="0.00000;0.12500;0.24500;0.29500;0.33333;1.00000" dur="24s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.294;0.295;1" dur="24s" repeatCount="indefinite" />
      </rect>
      <g clip-path="url(#line-1)"><text y="0">Exploring sensing, control and edge computing</text></g>
      <rect y="-24" width="2" height="29" fill="#6d35c4" opacity="0">
        <animate attributeName="x" values="0;0;654;654;0;0;0" keyTimes="0.00000;0.33333;0.45833;0.57833;0.62833;0.66667;1.00000" dur="24s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.334;0.627;0.628;1" dur="24s" repeatCount="indefinite" />
      </rect>
      <g clip-path="url(#line-2)"><text y="0">Looking for my first embedded or firmware role</text></g>
      <rect y="-24" width="2" height="29" fill="#6d35c4" opacity="0">
        <animate attributeName="x" values="0;0;668.4;668.4;0;0" keyTimes="0.00000;0.66667;0.79167;0.91167;0.96167;1.00000" dur="24s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.666;0.667;0.96;1" dur="24s" repeatCount="indefinite" />
      </rect>
    </g>
    <text class="still">C / Embedded C / microcontrollers</text>
  </g>
    <path d="M0 328 C225 287 360 358 606 324 S992 296 1200 323 V380 H0Z" fill="#b495eb" opacity=".5"/>
    <path class="motion" d="M0 328 C225 287 360 358 606 324 S992 296 1200 323 V380 H0Z" fill="#b495eb" opacity=".45">
      <animate attributeName="d" values="M0 328 C225 287 360 358 606 324 S992 296 1200 323 V380 H0Z;M0 302 C225 363 360 292 606 338 S992 347 1200 302 V380 H0Z;M0 328 C225 287 360 358 606 324 S992 296 1200 323 V380 H0Z" dur="8s" repeatCount="indefinite"/>
    </path>
    <path class="motion" d="M0 346 C260 311 398 366 660 344 S1000 315 1200 340 V380 H0Z" fill="url(#wave)" opacity=".85">
      <animate attributeName="d" values="M0 346 C260 311 398 366 660 344 S1000 315 1200 340 V380 H0Z;M0 331 C260 374 398 316 660 349 S1000 373 1200 326 V380 H0Z;M0 346 C260 311 398 366 660 344 S1000 315 1200 340 V380 H0Z" dur="11s" repeatCount="indefinite"/>
    </path>
    <path class="motion" d="M0 360 Q300 335 600 360 T1200 360 V380 H0Z" fill="#29b7b0" opacity=".38">
      <animate attributeName="d" values="M0 360 Q300 335 600 360 T1200 360 V380 H0Z;M0 349 Q300 381 600 349 T1200 349 V380 H0Z;M0 360 Q300 335 600 360 T1200 360 V380 H0Z" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
