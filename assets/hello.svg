<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Pramothraj. Embedded systems and firmware.</title>
  <desc id="desc">A warm, softly animated introduction with slow rolling waves and a rotating typewriter line about C, microcontrollers and entry-level embedded roles.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf8f2"/><stop offset="1" stop-color="#f3f7f2"/>
    </linearGradient>
    <linearGradient id="wash"><stop stop-color="#d9e9e0"/><stop offset="1" stop-color="#ecd9c6"/></linearGradient>
    <clipPath id="line-0"><rect x="0" y="-30" width="481.2" height="46"><animate attributeName="width" values="0;481.2;481.2;0;0;0" keyTimes="0.00000;0.12500;0.24500;0.29500;0.33333;1.00000" dur="24s" repeatCount="indefinite" /></rect></clipPath>
    <clipPath id="line-1"><rect x="0" y="-30" width="0" height="46"><animate attributeName="width" values="0;0;654;654;0;0;0" keyTimes="0.00000;0.33333;0.45833;0.57833;0.62833;0.66667;1.00000" dur="24s" repeatCount="indefinite" /></rect></clipPath>
    <clipPath id="line-2"><rect x="0" y="-30" width="0" height="46"><animate attributeName="width" values="0;0;668.4;668.4;0;0" keyTimes="0.00000;0.66667;0.79167;0.91167;0.96167;1.00000" dur="24s" repeatCount="indefinite" /></rect></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .typed text { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 24px; }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .still { display: inline; }
    }
  </style>
  <rect width="1200" height="360" rx="20" fill="url(#paper)"/>
  <circle cx="1060" cy="104" r="66" fill="#efdfce" opacity=".55"/>
  <circle class="motion" cx="1060" cy="104" r="52" fill="none" stroke="#d4b89b" stroke-width="1.3" opacity=".45">
    <animate attributeName="r" values="52;62;52" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;.18;.45" dur="12s" repeatCount="indefinite"/>
  </circle>
  <g fill="#53766a">
    <circle cx="78" cy="49" r="4"/>
    <text x="94" y="55" font-size="17" letter-spacing="1.5">EMBEDDED SYSTEMS · FIRMWARE</text>
  </g>
  <text x="72" y="136" fill="#283d35" style="font-family:Georgia,'Times New Roman',serif" font-size="64" letter-spacing="-1.5">Hi, I'm Pramothraj.</text>
  <text x="76" y="187" font-size="23" fill="#64736a">I like figuring out how software works with hardware.</text>
  <g class="typed" transform="translate(77 244)" fill="#3f766c" style="font-family:ui-monospace,'Cascadia Code',Consolas,monospace;font-size:24px">
    <g class="motion">
      <g clip-path="url(#line-0)"><text y="0">C / Embedded C / microcontrollers</text></g>
      <rect y="-24" width="2" height="29" fill="#3f766c" opacity="0">
        <animate attributeName="x" values="0;481.2;481.2;0;0;0" keyTimes="0.00000;0.12500;0.24500;0.29500;0.33333;1.00000" dur="24s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.294;0.295;1" dur="24s" repeatCount="indefinite" />
      </rect>
      <g clip-path="url(#line-1)"><text y="0">Exploring sensing, control and edge computing</text></g>
      <rect y="-24" width="2" height="29" fill="#3f766c" opacity="0">
        <animate attributeName="x" values="0;0;654;654;0;0;0" keyTimes="0.00000;0.33333;0.45833;0.57833;0.62833;0.66667;1.00000" dur="24s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.333;0.334;0.627;0.628;1" dur="24s" repeatCount="indefinite" />
      </rect>
      <g clip-path="url(#line-2)"><text y="0">Looking for my first embedded or firmware role</text></g>
      <rect y="-24" width="2" height="29" fill="#3f766c" opacity="0">
        <animate attributeName="x" values="0;0;668.4;668.4;0;0" keyTimes="0.00000;0.66667;0.79167;0.91167;0.96167;1.00000" dur="24s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.666;0.667;0.96;1" dur="24s" repeatCount="indefinite" />
      </rect>
    </g>
    <text class="still">C / Embedded C / microcontrollers</text>
  </g>
  <path d="M0 319 C225 278 360 349 606 315 S992 287 1200 314 V360 H0Z" fill="#dfebe3"/>
  <path class="motion" d="M0 319 C225 278 360 349 606 315 S992 287 1200 314 V360 H0Z" fill="url(#wash)" opacity=".7">
    <animate attributeName="d" values="M0 319 C225 278 360 349 606 315 S992 287 1200 314 V360 H0Z;M0 306 C225 350 360 288 606 321 S992 335 1200 301 V360 H0Z;M0 319 C225 278 360 349 606 315 S992 287 1200 314 V360 H0Z" dur="18s" repeatCount="indefinite"/>
  </path>
  <path class="motion" d="M0 333 C260 311 398 349 660 331 S1000 309 1200 329" fill="none" stroke="#faf8f2" stroke-width="2" opacity=".85">
    <animate attributeName="d" values="M0 333 C260 311 398 349 660 331 S1000 309 1200 329;M0 329 C260 350 398 311 660 334 S1000 347 1200 324;M0 333 C260 311 398 349 660 331 S1000 309 1200 329" dur="14s" repeatCount="indefinite"/>
  </path>
</svg>
