<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="375" viewBox="0 0 1200 375" role="img" aria-labelledby="title desc">
<title id="title">Public code — Embedded job discovery automation</title>
<desc id="desc">An animated four-stage pipeline showing the actual public project's RSS collection, filtering, ranking and Markdown reporting.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .still { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .motion { display: none; }
    .still { display: inline; }
  }
</style>
<defs>
