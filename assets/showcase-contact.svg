<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
<title id="title">Open to a first embedded engineering role — Contact Pramothraj</title><desc id="desc">An animated contact card for graduate and entry-level embedded software and firmware opportunities.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .still { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .motion { display: none; }
    .still { display: inline; }
  }
</style>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151427"/><stop offset=".6" stop-color="#211a44"/><stop offset="1" stop-color="#073641"/></linearGradient>
  <linearGradient id="circle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b48cff"/><stop offset="1" stop-color="#61dfed"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#9465e9" stop-opacity=".45"/><stop offset="1" stop-color="#9465e9" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="280" rx="22" fill="url(#canvas)"/>
<ellipse class="motion" cx="960" cy="135" rx="205" ry="146" fill="url(#light)">
  <animate attributeName="rx" values="205;270;205" dur="7s" repeatCount="indefinite"/>
</ellipse>
<text x="63" y="47" fill="#c3aff5" font-size="15" letter-spacing="3">05 / LET'S CONNECT</text>
<text x="59" y="108" fill="#f9f8ff" font-size="48" font-weight="750" letter-spacing="-1.2">Open to my first</text>
<text x="59" y="167" fill="#f9f8ff" font-size="48" font-weight="750" letter-spacing="-1.2">embedded engineering role.</text>
<text x="63" y="217" fill="#b2c7dc" font-size="21">Embedded software · Firmware · Graduate opportunities</text>
<text x="63" y="252" fill="#8ca9c0" font-size="16">Bengaluru preferred · India &amp; abroad · harishanandh007@gmail.com</text>
<circle cx="1015" cy="139" r="71" fill="url(#circle)"/>
<circle class="motion" cx="1015" cy="139" r="88" fill="none" stroke="url(#circle)" stroke-width="2" stroke-dasharray="166 30 62 48 77 170">
  <animateTransform attributeName="transform" type="rotate" from="0 1015 139" to="360 1015 139" dur="12s" repeatCount="indefinite"/>
</circle>
<text x="1015" y="133" text-anchor="middle" fill="#172343" font-size="20" font-weight="650" letter-spacing="1">LET'S</text>
<text x="1015" y="165" text-anchor="middle" fill="#172343" font-size="29" font-weight="750">TALK ↗</text>
</svg>
