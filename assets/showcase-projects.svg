<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" role="img" aria-labelledby="title desc">
<title id="title">Academic engineering — Smart metering and wind-turbine control</title><desc id="desc">Animated energy and wind motifs introduce two academic projects. These are decorative icons, not research diagrams or measured results.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .still { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .motion { display: none; }
    .still { display: inline; }
  }
</style>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161124"/><stop offset="1" stop-color="#111a26"/></linearGradient>
  <linearGradient id="left"><stop stop-color="#231735"/><stop offset="1" stop-color="#17182c"/></linearGradient>
  <linearGradient id="right"><stop stop-color="#112b32"/><stop offset="1" stop-color="#15212d"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#b58aff"/><stop offset="1" stop-color="#55e3d4"/></linearGradient>
</defs>
<rect width="1200" height="425" rx="22" fill="url(#canvas)"/>
<text x="62" y="47" fill="#c6a0ff" font-size="15" letter-spacing="3">01 / ACADEMIC ENGINEERING</text>
<text x="59" y="108" fill="#f7f8ff" font-size="48" font-weight="750" letter-spacing="-1.3">Energy. Control. Intelligence.</text>
<text x="62" y="149" fill="#a9a4bf" font-size="20">Two academic projects connecting electronics with embedded software.</text>
<rect x="34" y="179" width="550" height="209" rx="20" fill="url(#left)" stroke="#8a61b8" stroke-opacity=".4"/>
<rect x="616" y="179" width="550" height="209" rx="20" fill="url(#right)" stroke="#368b8f" stroke-opacity=".45"/>
<text x="62" y="210" fill="#ad8cce" class="mono" font-size="13" letter-spacing="1.2">M.E. / POSTGRADUATE RESEARCH</text>
<text x="644" y="210" fill="#72c1bc" class="mono" font-size="13" letter-spacing="1.2">B.E. / TEAM PROTOTYPE</text>
<circle cx="112" cy="275" r="39" fill="#aa71ff" fill-opacity=".1" stroke="#a97ee8" stroke-opacity=".4"/>
<path d="M118 246 L93 278 H111 L103 305 L132 271 H114Z" fill="#b88bff"/>
