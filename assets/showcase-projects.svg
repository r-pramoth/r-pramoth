  </path>
</g>
<text x="770" y="267" fill="#ecfffb" font-size="33" font-weight="650">Wind-turbine</text>
<text x="770" y="304" fill="#ecfffb" font-size="33" font-weight="650">gear control</text>
<text x="644" y="356" fill="#8eb7b6" font-size="18">Arduino Uno · Speed sensing · Integration</text>
