</circle>
<text x="174" y="267" fill="#f6efff" font-size="33" font-weight="650">Smart energy</text>
<text x="174" y="304" fill="#f6efff" font-size="33" font-weight="650">metering</text>
<text x="62" y="356" fill="#a99cbd" font-size="18">Embedded sensing · Edge computing</text>
<g transform="translate(655 251)" fill="none" stroke="#60ded0" stroke-width="3" stroke-linecap="round">
  <path d="M0 1 H40 Q56 1 56 -10 Q56 -21 44 -21"/>
  <path d="M0 18 H65 Q80 18 80 5"/>
  <path d="M0 35 H41 Q55 35 55 46"/>
